version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fedretina-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload in dev: mount source so edits are picked up
      - ./src:/app/src:ro
    command: >
      uvicorn fedretina.main:app
        --host 0.0.0.0
        --port 8000
        --reload
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
